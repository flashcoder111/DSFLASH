<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="title desc">
  <title id="title">Coding score versus modeled cost per task</title>
  <desc id="desc">Scatter plot of independent coding score against cost per completed multi-file coding task on a log scale. DeepSeek V4.1 Flash sits at a 30.6 score and 0.10 dollars per task.</desc>
  <rect width="1200" height="700" fill="#f7f9fc"/>
  <text x="60" y="58" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#18243d">What one finished coding task costs</text>
  <text x="60" y="88" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#4b5568">Coding score (0 to 100) vs cost per task, log scale. Lower right is better value.</text>

  <g font-family="Arial,Helvetica,sans-serif">
    <!-- plot x 130..1140: log10(cost) -2 .. 1, so x = 130 + (log10(c)+2)*336.67 -->
    <g stroke="#e1e7f0" stroke-width="1">
      <line x1="130" y1="120" x2="130" y2="600"/>
      <line x1="467" y1="120" x2="467" y2="600"/>
      <line x1="803" y1="120" x2="803" y2="600"/>
      <line x1="1140" y1="120" x2="1140" y2="600"/>
      <line x1="130" y1="600" x2="1140" y2="600"/>
      <line x1="130" y1="520" x2="1140" y2="520"/>
      <line x1="130" y1="440" x2="1140" y2="440"/>
      <line x1="130" y1="360" x2="1140" y2="360"/>
      <line x1="130" y1="280" x2="1140" y2="280"/>
      <line x1="130" y1="200" x2="1140" y2="200"/>
      <line x1="130" y1="120" x2="1140" y2="120"/>
    </g>
    <g font-size="13" fill="#7b8698" text-anchor="middle">
      <text x="130" y="626">$0.01</text>
      <text x="467" y="626">$0.10</text>
      <text x="803" y="626">$1</text>
      <text x="1140" y="626">$10</text>
    </g>
    <g font-size="13" fill="#7b8698" text-anchor="end">
      <text x="118" y="605">0</text>
      <text x="118" y="525">10</text>
      <text x="118" y="445">20</text>
      <text x="118" y="365">30</text>
      <text x="118" y="285">40</text>
      <text x="118" y="205">50</text>
      <text x="118" y="125">60</text>
    </g>
    <text x="635" y="672" font-size="15" fill="#4b5568" text-anchor="middle">Modeled cost to finish one multi-file coding change (USD, log scale)</text>
    <text x="34" y="365" font-size="15" fill="#4b5568" text-anchor="middle" transform="rotate(-90 34 365)">Coding score</text>

    <!-- x = 130 + (log10(c)+2)*336.67 ; y = 600 - score/60*480 -->
    <g>
      <circle cx="333" cy="336" r="7" fill="#8fa3c4"/>
      <text x="347" y="328" font-size="13" fill="#44506a">Muse Ember</text>

      <circle cx="365" cy="327" r="7" fill="#8fa3c4"/>
      <text x="379" y="350" font-size="13" fill="#44506a">Claude Haiku 5.5</text>

      <circle cx="467" cy="355" r="11" fill="#2563eb" stroke="#fff" stroke-width="2"/>
      <text x="481" y="380" font-size="14" font-weight="700" fill="#1d4ed8">DeepSeek V4.1 Flash</text>

      <circle cx="676" cy="219" r="7" fill="#8fa3c4"/>
      <text x="690" y="211" font-size="13" fill="#44506a">GPT-6.1 Terra</text>

      <circle cx="776" cy="194" r="7" fill="#8fa3c4"/>
      <text x="790" y="186" font-size="13" fill="#44506a">GPT-6.2 Sol</text>

      <circle cx="967" cy="175" r="7" fill="#8fa3c4"/>
      <text x="981" y="167" font-size="13" fill="#44506a">Claude Fable 5.2</text>

      <circle cx="1034" cy="207" r="7" fill="#8fa3c4"/>
      <text x="1000" y="230" font-size="13" fill="#44506a">GPT-6 Astra</text>
    </g>

    <rect x="60" y="648" width="1080" height="1" fill="#d8e0ee"/>
  </g>
</svg>
