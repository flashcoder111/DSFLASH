<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="title desc">
  <title id="title">Flagship LLM selection guide by workload</title>
  <desc id="desc">A four-row table mapping workloads to model focus and verification points: low cost and high concurrency to DeepSeek, complex multi-step agent work to Kimi, software engineering to GLM, multimodal enterprise deployment to Qwen.</desc>
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#efefea" stroke-width="1"/>
    </pattern>
    <style>
      .eyebrow{font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:700;letter-spacing:2.4px;fill:#2563eb}
      .h1{font-family:Arial,Helvetica,sans-serif;font-size:35px;font-weight:700;letter-spacing:-0.6px;fill:#18243d}
      .sub{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#636363}
      .th{font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:700;letter-spacing:1.6px;fill:#8a8a86}
      .cell{font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;fill:#18243d}
      .model{font-family:Arial,Helvetica,sans-serif;font-size:17px;font-weight:700;fill:#2563eb}
      .cell-sub{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#636363}
      .note{font-family:Arial,Helvetica,sans-serif;font-size:14px;fill:#6b6b66}
    </style>
  </defs>

  <rect width="1200" height="640" fill="#fcfcfa"/>
  <rect width="1200" height="640" fill="url(#grid)"/>
  <rect x="0" y="0" width="6" height="640" fill="#2563eb"/>

  <text x="64" y="76" class="eyebrow">SELECTION GUIDE</text>
  <text x="64" y="128" class="h1">Start from the workload, not the leaderboard</text>
  <text x="64" y="162" class="sub">Four common asks, and where each flagship is pointed.</text>

  <rect x="64" y="200" width="1072" height="44" fill="#fafafa" stroke="#e7e7e3"/>
  <text x="88" y="228" class="th">WORKLOAD</text>
  <text x="470" y="228" class="th">MODEL FOCUS</text>
  <text x="700" y="228" class="th">VERIFY IN YOUR OWN TEST</text>

  <rect x="64" y="244" width="1072" height="72" fill="#ffffff" stroke="#e7e7e3"/>
  <text x="88" y="276" class="cell">Low cost, high concurrency</text>
  <text x="88" y="298" class="cell-sub">millions of tokens per day</text>
  <text x="470" y="286" class="model">DeepSeek</text>
  <text x="700" y="276" class="cell-sub">cost per finished task, latency,</text>
  <text x="700" y="298" class="cell-sub">task success rate</text>

  <rect x="64" y="316" width="1072" height="72" fill="#fafafa" stroke="#e7e7e3"/>
  <text x="88" y="348" class="cell">Complex, multi-step agent work</text>
  <text x="88" y="370" class="cell-sub">projects, not single answers</text>
  <text x="470" y="358" class="model">Kimi</text>
  <text x="700" y="348" class="cell-sub">goal retention, tool calls,</text>
  <text x="700" y="370" class="cell-sub">acceptance of the final deliverable</text>

  <rect x="64" y="388" width="1072" height="72" fill="#ffffff" stroke="#e7e7e3"/>
  <text x="88" y="420" class="cell">Software engineering and coding</text>
  <text x="88" y="442" class="cell-sub">terminal-heavy workflows</text>
  <text x="470" y="430" class="model">GLM</text>
  <text x="700" y="420" class="cell-sub">tests passing, environment fit,</text>
  <text x="700" y="442" class="cell-sub">correctness of the result</text>

  <rect x="64" y="460" width="1072" height="72" fill="#fafafa" stroke="#e7e7e3"/>
  <text x="88" y="492" class="cell">Multimodal and enterprise deployment</text>
  <text x="88" y="514" class="cell-sub">documents, images, video, custom hosting</text>
  <text x="470" y="502" class="model">Qwen</text>
  <text x="700" y="492" class="cell-sub">input coverage, tooling,</text>
  <text x="700" y="514" class="cell-sub">hardware needed to serve it</text>

  <line x1="64" y1="572" x2="1136" y2="572" stroke="#e7e7e3"/>
  <text x="64" y="602" class="note">A selection index drawn from this article's reading. Not a unified benchmark ranking.</text>
  <text x="1136" y="602" text-anchor="end" class="note">deepseekv4flash.com</text>
</svg>
