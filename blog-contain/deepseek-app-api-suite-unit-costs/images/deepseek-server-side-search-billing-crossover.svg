<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="title desc">
  <title id="title">Server-side search billing crossover at about 5,357 tokens per query</title>
  <desc id="desc">Line chart comparing the old flat fee of 0.75 dollars per 1,000 searches with the new input-token price at 0.14 dollars per million tokens. The lines cross at about 5,357 tokens per query, roughly 11 results at 500 tokens each.</desc>
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#efefea" stroke-width="1"/>
    </pattern>
    <style>
      .eyebrow{font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:700;letter-spacing:2.4px;fill:#2563eb}
      .h1{font-family:Arial,Helvetica,sans-serif;font-size:38px;font-weight:700;letter-spacing:-.8px;fill:#18243d}
      .sub{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#636363}
      .axis{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#8a8a86}
      .axis-title{font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:700;letter-spacing:1.2px;fill:#8a8a86}
      .line-label{font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;fill:#18243d}
      .cross{font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;fill:#2563eb}
      .cross-sub{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#4b5563}
      .region{font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:700;letter-spacing:.2px}
      .note{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#6b6b66}
    </style>
  </defs>

  <rect width="1200" height="700" fill="#fcfcfa"/>
  <rect width="1200" height="700" fill="url(#grid)"/>
  <rect x="0" y="0" width="6" height="700" fill="#2563eb"/>

  <text x="64" y="64" class="eyebrow">BILLING CHANGE</text>
  <text x="64" y="116" class="h1">Where the new search price crosses the old one</text>
  <text x="64" y="150" class="sub">Cost per 1,000 queries against the average content injected per query.</text>

  <rect x="120" y="200" width="536" height="360" fill="#f4f7ff"/>
  <rect x="656" y="200" width="464" height="360" fill="#fdf7ef"/>

  <g class="axis">
    <text x="104" y="564" text-anchor="end">$0</text>
    <text x="104" y="504" text-anchor="end">$0.25</text>
    <text x="104" y="444" text-anchor="end">$0.50</text>
    <text x="104" y="384" text-anchor="end">$0.75</text>
    <text x="104" y="324" text-anchor="end">$1.00</text>
    <text x="104" y="264" text-anchor="end">$1.25</text>
    <text x="104" y="204" text-anchor="end">$1.50</text>
  </g>
  <line x1="120" y1="500" x2="1120" y2="500" stroke="#e8e8e2"/>
  <line x1="120" y1="440" x2="1120" y2="440" stroke="#e8e8e2"/>
  <line x1="120" y1="380" x2="1120" y2="380" stroke="#e0e0da"/>
  <line x1="120" y1="320" x2="1120" y2="320" stroke="#e8e8e2"/>
  <line x1="120" y1="260" x2="1120" y2="260" stroke="#e8e8e2"/>
  <line x1="120" y1="200" x2="1120" y2="200" stroke="#e8e8e2"/>
  <line x1="120" y1="560" x2="1120" y2="560" stroke="#d8d8d2"/>

  <g class="axis">
    <text x="120" y="584" text-anchor="middle">0</text>
    <text x="320" y="584" text-anchor="middle">2,000</text>
    <text x="520" y="584" text-anchor="middle">4,000</text>
    <text x="720" y="584" text-anchor="middle">6,000</text>
    <text x="920" y="584" text-anchor="middle">8,000</text>
    <text x="1120" y="584" text-anchor="middle">10,000</text>
  </g>

  <text x="380" y="522" text-anchor="middle" class="region" fill="#2563eb">Cheaper under token billing</text>
  <text x="888" y="522" text-anchor="middle" class="region" fill="#9a6b2f">Cheaper under per-call billing</text>

  <line x1="120" y1="380" x2="1120" y2="380" stroke="#18243d" stroke-width="3"/>
  <text x="1110" y="368" text-anchor="end" class="line-label">$0.75 per 1,000 queries (old per-call rate)</text>

  <line x1="120" y1="560" x2="1120" y2="224" stroke="#2563eb" stroke-width="3"/>
  <text x="620" y="300" class="line-label" fill="#2563eb">Input tokens at $0.14 per 1M</text>

  <line x1="656" y1="380" x2="656" y2="560" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 5"/>
  <circle cx="656" cy="380" r="7" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <line x1="606" y1="336" x2="648" y2="374" stroke="#9fb2db" stroke-width="1.5"/>
  <rect x="326" y="309" width="280" height="54" rx="7" fill="#ffffff" stroke="#dbe4f8"/>
  <text x="466" y="331" text-anchor="middle" class="cross">5,357 tokens per query</text>
  <text x="466" y="351" text-anchor="middle" class="cross-sub">about 11 results at 500 tokens each</text>

  <text x="120" y="620" class="axis-title">AVERAGE CONTENT INJECTED PER QUERY (TOKENS)</text>
  <line x1="64" y1="650" x2="1136" y2="650" stroke="#e7e7e3"/>
  <text x="64" y="678" class="note">Cache-miss input rate. Fresh search results rarely qualify for prefix-cache pricing.</text>
  <text x="1136" y="678" text-anchor="end" class="note">deepseekv4flash.com</text>
</svg>
